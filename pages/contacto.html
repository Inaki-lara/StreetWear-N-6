<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SEO -->
    <meta name="description" content="Ponete en contacto con StreetWear para consultas sobre pedidos, atencion al cliente.">
    <meta name="keywords" content="contacto streetwear, atencion al cliente ropa, soporte streetwear.">
    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- CSS -->
    <link rel="stylesheet" href="../styles/styles.css">
    <title>StreetWear | Contacto</title>
</head>

<body class="pagina">
    <header>
        <nav class="navbar navbar-expand-lg" data-bs-theme="dark">
            <div class="container">
                <a class="navbar-brand" href="../index.html">
                    <figure>
                        <img class="img-logo" src="../img/logo.jpg" alt="Logo de StreetWear">
                    </figure>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                    aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menu">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="./producto.html">Tienda</a></li>
                        <li class="nav-item"><a class="nav-link" href="./nosotros.html">Nosotros</a></li>
                        <li class="nav-item"><a class="nav-link" href="./preguntas.html">Preguntas Frecuentes</a></li>
                        <li class="nav-item"><a class="nav-link active" href="./contacto.html">Contacto</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>


    <main class="main-contenedor">
        <h1 class="titulo-principal">Contactate con nosotros</h1>
        <section class="bloque-seccion">
            <p><strong>Dirección: Buenos Aires 3045</strong></p>
            <p><strong>Teléfono: +54 225654789</strong></p>
            <p><strong>Instagram: @StreetWear</strong></p>
        </section>
        <section class="bloque-seccion">
            <form class="formulario" action="#" method="post">
                <div class="campo-grupo">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" id="nombre" name="nombre" class="form-input" required placeholder="Tu nombre">
                </div>
                <div class="campo-grupo">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <input type="email" id="email" name="email" class="form-input" required
                        placeholder="email@example.com">
                </div>
                <div class="campo-grupo">
                    <label for="mensaje" class="form-label">Mensaje</label>
                    <textarea name="mensaje" id="mensaje" rows="4" class="form-input"
                        placeholder="¿En qué puedo ayudarte?"></textarea>
                </div>
                <button type="submit" class="btn btn-warning">Enviar mensaje</button>
            </form>
        </section>
    </main>
    <footer class="pie">
        <p>Desarrollado por Iñaki</p>
        <p>&copy; <span id="year"></span> Todos los Derechos Reservados.</p>
        <nav>
            <ul>
                <li>
                    <a href="https://www.instagram.com/" target="_blank">Instagram</a>
                </li>
                <li>
                    <a href="https://www.facebook.com/" target="_blank">Facebook</a>
                </li>
                <li>
                    <a href="https://www.whatsapp.com/" target="_blank">WhatsApp</a>
                </li>
            </ul>
        </nav>
    </footer>
    <!-- BOOTSTRAP -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>

</html>
